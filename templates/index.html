<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
      :root {
        --bg: #1a1f2e;
        --fg: #e8ecf4;
        --muted: #9aa3b5;
        --accent: #6ec6ff;
        --panel: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--fg);
        background:
          radial-gradient(ellipse at 20% 20%, #2a3550 0%, transparent 50%),
          radial-gradient(ellipse at 80% 80%, #1e3a4a 0%, transparent 45%),
          var(--bg);
      }

      #deck {
        width: min(40rem, calc(100vw - 2rem));
        min-height: 18rem;
        padding: 2.5rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--panel);
        backdrop-filter: blur(8px);
        overflow: hidden;
      }

      .slide-pane {
        min-height: calc(18rem - 5rem);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 2rem;
      }

      .slide-content {
        text-align: center;
      }

      .slide-content h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--accent);
      }

      .slide-content p {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.5;
        color: var(--muted);
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .counter {
        font-size: 0.9rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      button {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 0.95rem;
        padding: 0.55rem 1rem;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      }

      button:hover:not(:disabled) {
        background: rgba(110, 198, 255, 0.12);
        border-color: var(--accent);
      }

      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .slide-pane.from-next {
        animation: slide-in-from-right 160ms ease both;
      }

      .slide-pane.from-prev {
        animation: slide-in-from-left 160ms ease both;
      }

      @keyframes slide-in-from-right {
        from {
          opacity: 0;
          transform: translateX(1rem);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slide-in-from-left {
        from {
          opacity: 0;
          transform: translateX(-1rem);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="deck">
      {% include "slide.html" %}
    </div>
  </body>
</html>
